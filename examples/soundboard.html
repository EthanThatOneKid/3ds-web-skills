<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Retro Soundboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: monospace;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 16px;
            margin: 10px 0;
            color: #0af;
            text-transform: uppercase;
        }
        #status {
            font-size: 10px;
            color: #888;
            margin-bottom: 10px;
            height: 12px;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 10px;
            max-width: 320px;
            margin: 0 auto;
        }
        .btn {
            background-color: #333;
            border: 2px solid #555;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            width: 135px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #111;
        }
        .btn:active, .btn.active {
            background-color: #0af;
            border-color: #fff;
            color: #000;
            transform: translateY(4px);
            box-shadow: none;
        }
        /* Hidden audio element to bypass sandbox */
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Retro Soundboard</h1>
    <div id="status">READY</div>
    
    <div class="grid">
        <div class="btn" data-sfx="coin">Coin</div>
        <div class="btn" data-sfx="jump">Jump</div>
        <div class="btn" data-sfx="laser">Laser</div>
        <div class="btn" data-sfx="powerup">Powerup</div>
        <div class="btn" data-sfx="hit">Hit</div>
        <div class="btn" data-sfx="oneup">1-Up</div>
    </div>

    <audio id="player" controls></audio>
    <script>
        var statusEl = document.getElementById('status');
        var player = document.getElementById('player');
        // Calculate the absolute base path to bypass 3DS cross-process relative path bugs
        var basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));

        var btns = document.querySelectorAll('.btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('touchstart', function(e) {
                e.preventDefault();
                playSound(this);
            }, false);
            
            btns[i].addEventListener('mousedown', function(e) {
                playSound(this);
            }, false);
        }

        function playSound(btnEl) {
            var sfx = btnEl.getAttribute('data-sfx');
            
            // Visual feedback
            btnEl.classList.add('active');
            setTimeout(function() {
                btnEl.classList.remove('active');
            }, 150);

            try {
                statusEl.innerHTML = 'PLAYING: ' + sfx.toUpperCase();
                
                // Force cache-busting timestamp on every tap
                player.src = basePath + '/audio/' + sfx + '.mp3?t=' + Date.now();
                
                var p = player.play();
                if (p && p.catch) {
                    p.catch(function(e) {
                        statusEl.innerHTML = 'ERR: ' + e.message.substring(0,20);
                        statusEl.style.color = '#f00';
                    });
                }
            } catch (e) {
                statusEl.innerHTML = 'ERR: ' + e.message.substring(0,20);
                statusEl.style.color = '#f00';
            }
        }
    </script>
</body>
</html>
