<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Debug</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
    var c = document.getElementById('c');
    var x = c.getContext ? c.getContext('2d') : null;
    var W = 320, H = 240;
    var pressed = {};
    var allKeys = [];
    var logLines = [];

    function resize() {
        if (!c) return;
        W = c.width = Math.floor(window.innerWidth);
        H = c.height = Math.floor(window.innerHeight);
    }
    resize();
    window.addEventListener('resize', resize);

    function log(msg) {
        logLines.push(msg);
        if (logLines.length > 8) logLines.shift();
        console.log(msg);
    }

    function btn(name, down) {
        if (down && !pressed[name]) log(name + ' DOWN');
        else if (!down && pressed[name]) log(name + ' UP');
        pressed[name] = down;
    }

    // Track ALL keydown/keyup with key and keyCode
    window.addEventListener('keydown', function(e) {
        log('keydown: key=' + e.key + ' code=' + e.keyCode + ' char=' + String.fromCharCode(e.keyCode));
        allKeys.push(e.key);
        if (allKeys.length > 20) allKeys.shift();
    });

    window.addEventListener('keyup', function(e) {
        log('keyup: key=' + e.key);
    });

    // Try Gamepad API
    function checkGamepads() {
        if (!navigator.webkitGetGamepads) return;
        var gps = navigator.webkitGetGamepads();
        for (var i = 0; i < gps.length; i++) {
            var gp = gps[i];
            if (!gp) continue;
            log('Gamepad found: ' + gp.id);
            for (var j = 0; j < gp.buttons.length; j++) {
                if (gp.buttons[j].pressed) {
                    log('Gamepad btn ' + j + ' pressed');
                }
            }
        }
    }

    function draw() {
        if (!x) return;
        x.fillStyle = '#000';
        x.fillRect(0, 0, W, H);

        x.fillStyle = '#0f0';
        x.font = '12px monospace';
        x.textAlign = 'left';
        for (var i = 0; i < logLines.length; i++) {
            x.fillText(logLines[i], 4, 16 + i * 14);
        }

        x.fillStyle = '#fff';
        x.font = '14px monospace';
        x.textAlign = 'center';

        var keys = Object.keys(pressed).filter(function(k) { return pressed[k]; });
        if (keys.length === 0) {
            x.fillText('Waiting...', W / 2, H / 2);
        } else {
            x.fillText(keys.join(' + '), W / 2, H / 2);
        }

        x.font = '10px monospace';
        x.fillText('3DS INPUT DEBUG', W / 2, H * 0.15);
        x.fillText('keys: ' + allKeys.slice(-10).join(', '), W / 2, H * 0.85);
    }

    setInterval(function() {
        checkGamepads();

        var map = {
            'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
            'Z': 'B', 'X': 'A', 'A': 'Y', 'S': 'X',
            'z': 'B', 'x': 'A', 'a': 'Y', 's': 'X',
            'Enter': 'START',
            '1': 'SELECT',
            'L': 'L', 'R': 'R'
        };

        // Map from accumulated allKeys for keydown
        var lastKey = allKeys[allKeys.length - 1];
        if (lastKey && map[lastKey]) {
            btn(map[lastKey], true);
        }

        draw();
    }, 1000 / 30);

    window.addEventListener('touchstart', function(e) {
        e.preventDefault();
        log('TOUCH at ' + e.touches[0].clientX + ',' + e.touches[0].clientY);
    });

    // Initial draw
    if (x) {
        x.fillStyle = '#000';
        x.fillRect(0, 0, W, H);
        x.fillStyle = '#0f0';
        x.font = '12px monospace';
        x.fillText('Loading...', W / 2, H / 2);
    }

    log('Debug started');
})();
</script>
</body>
</html>
