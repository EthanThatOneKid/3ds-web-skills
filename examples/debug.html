<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Input Debug</title>
    <style>
        body { margin: 0; background: #111; color: #0f0; font-family: monospace; }
        #info { padding: 20px; font-size: 18px; }
        .label { font-size: 14px; color: #666; }
        #touch-area {
            width: 100vw; height: 60vh;
            border: 2px solid #0f0;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin-top: 20px;
        }
        #status { padding: 20px; font-size: 48px; font-weight: bold; text-align: center; }
        #log { padding: 10px; font-size: 12px; color: #080; height: 100px; overflow: auto; }
    </style>
</head>
<body>
    <div id="info">
        <div class="label">3DS BUTTON INPUT</div>
        <div id="status">PRESS ANY BUTTON</div>
        <div id="touch-area">TOUCH SCREEN<br><small>or use physical buttons</small></div>
        <div id="log"></div>
    </div>
<script>
(function() {
    var status = document.getElementById('status');
    var log = document.getElementById('log');
    var touchArea = document.getElementById('touch-area');

    var touchActive = false;
    var touchX = 0, touchY = 0;

    function update(txt) {
        status.textContent = txt;
        addLog(txt);
    }

    function addLog(msg) {
        var d = new Date();
        var t = d.toISOString().substr(11, 12);
        log.innerHTML = t + ' ' + msg + '<br>' + log.innerHTML;
        if (log.children.length > 20) log.removeChild(log.lastChild);
    }

    // Touch
    window.addEventListener('touchstart', function(e) {
        e.preventDefault();
        touchActive = true;
        var t = e.touches[0];
        touchX = t.clientX; touchY = t.clientY;
        update('TOUCH ' + Math.round(touchX) + ',' + Math.round(touchY));
        touchArea.textContent = 'TOUCH ACTIVE\n' + Math.round(touchX) + ',' + Math.round(touchY);
    }, false);

    window.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length > 0) {
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
            touchArea.textContent = 'TOUCHING\n' + Math.round(touchX) + ',' + Math.round(touchY);
        }
    }, false);

    window.addEventListener('touchend', function(e) {
        e.preventDefault();
        touchActive = false;
        touchArea.textContent = 'TOUCH SCREEN\n<small>or use physical buttons</small>';
    }, false);

    // Keyboard (for testing on desktop)
    window.addEventListener('keydown', function(e) {
        update('KEY ' + e.key + ' (code=' + e.keyCode + ')');
    });

    // Gamepad polling
    var lastGpState = '';
    setInterval(function() {
        try {
            var gas = navigator.webkitGetGamepads && navigator.webkitGetGamepads();
            if (gas) {
                for (var i = 0; i < gas.length; i++) {
                    var gp = gas[i];
                    if (gp && gp.buttons) {
                        var names = ['A','B','X','Y','SL','ST','HL','HR','UP','DN','L','R'];
                        for (var j = 0; j < gp.buttons.length && j < names.length; j++) {
                            var b = gp.buttons[j];
                            var pressed = typeof b === 'object' ? b.pressed : b > 0.5;
                            if (pressed) {
                                var state = names[j];
                                if (state !== lastGpState) {
                                    lastGpState = state;
                                    update('GAMEPAD ' + state + ' [' + j + ']');
                                }
                                return;
                            }
                        }
                    }
                    lastGpState = '';
                }
            }
        } catch (e) {}
    }, 100);

    addLog('ready - tap or press buttons');
})();
</script>
</body>
</html>
