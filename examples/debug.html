<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Touch Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
    var c = document.getElementById('c');
    var x = c ? c.getContext('2d') : null;
    var W = 320, H = 240;
    var touches = [];
    var lastTap = null;

    function resize() {
        if (!c) return;
        W = c.width = Math.floor(window.innerWidth);
        H = c.height = Math.floor(window.innerHeight);
    }
    resize();
    window.addEventListener('resize', resize);

    function dist(ax, ay, bx, by) {
        return Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
    }

    // Show last 12 events
    var events = [];
    function addEvent(msg) {
        events.push(msg);
        if (events.length > 12) events.shift();
    }

    window.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var t = e.touches[0];
        lastTap = { x: t.clientX, y: t.clientY, r: 0, t: Date.now() };
        addEvent('DOWN ' + Math.round(t.clientX) + ',' + Math.round(t.clientY));
    });

    window.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length > 0 && lastTap) {
            var t = e.touches[0];
            var d = dist(lastTap.x, lastTap.y, t.clientX, t.clientY);
            lastTap.x = t.clientX;
            lastTap.y = t.clientY;
            addEvent('MOVE d=' + Math.round(d));
        }
    });

    window.addEventListener('touchend', function(e) {
        e.preventDefault();
        addEvent('UP');
    });

    function draw() {
        if (!x) return;
        x.fillStyle = '#111';
        x.fillRect(0, 0, W, H);

        // Header
        x.fillStyle = '#0f0';
        x.font = 'bold 14px monospace';
        x.textAlign = 'center';
        x.fillText('3DS TOUCH DEBUG', W / 2, 18);

        // Zone labels
        x.font = '11px monospace';
        x.fillStyle = '#444';
        x.fillText('TOUCH ANYWHERE', W / 2, 40);
        x.fillText('drag to test motion', W / 2, 55);

        // Event log
        x.font = '11px monospace';
        x.fillStyle = '#0f0';
        x.textAlign = 'left';
        for (var i = 0; i < events.length; i++) {
            x.fillText(events[i], 4, 75 + i * 13);
        }

        // Tap circle
        if (lastTap) {
            var age = Date.now() - lastTap.t;
            var alpha = Math.max(0, 1 - age / 800);
            x.beginPath();
            x.arc(lastTap.x, lastTap.y, 20, 0, Math.PI * 2);
            x.strokeStyle = 'rgba(0,255,0,' + alpha + ')';
            x.lineWidth = 2;
            x.stroke();
            x.fillStyle = 'rgba(0,255,0,' + (alpha * 0.3) + ')';
            x.fill();
        }

        // Touch count
        x.fillStyle = '#888';
        x.font = '10px monospace';
        x.textAlign = 'center';
        x.fillText('touch works!', W / 2, H - 10);
    }

    function loop() {
        draw();
        requestAnimationFrame(loop);
    }
    loop();

    addEvent('ready - touch screen');
    if (x) draw();
})();
</script>
</body>
</html>
