<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Input Debug</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111; color: #0f0; font-family: monospace; }
        #title { padding: 12px; font-size: 18px; border-bottom: 1px solid #030; text-align: center; }
        #cross { display: flex; flex-direction: column; align-items: center; margin: 30px auto; width: 160px; height: 160px; }
        .arm { position: absolute; background: #0a0; color: #0f0; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        #up { top: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 50px; border-radius: 4px 4px 0 0; }
        #dn { bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 50px; border-radius: 0 0 4px 4px; }
        #lf { left: 0; top: 50%; transform: translateY(-50%); width: 50px; height: 40px; border-radius: 4px 0 0 4px; }
        #rt { right: 0; top: 50%; transform: translateY(-50%); width: 50px; height: 40px; border-radius: 0 4px 4px 0; }
        #ctr { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; background: #030; border-radius: 2px; }
        .active { background: #0f0 !important; color: #111 !important; }
        #buttons { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
        .btn { padding: 20px 30px; background: #0a0; border-radius: 8px; font-size: 24px; min-width: 60px; text-align: center; }
        #log { margin: 30px 10px; padding: 10px; background: #000; height: 120px; overflow: auto; font-size: 12px; border: 1px solid #030; }
        #note { margin: 10px; padding: 10px; font-size: 11px; color: #060; text-align: center; }
            canvas, img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="title">3DS INPUT DEBUG</div>
    <div id="cross">
        <div id="up" class="arm">UP<br>38</div>
        <div id="dn" class="arm">DN<br>40</div>
        <div id="lf" class="arm">LF<br>37</div>
        <div id="rt" class="arm">RT<br>39</div>
        <div id="ctr"></div>
    </div>
    <div id="buttons">
        <div id="a-btn" class="btn">A<br>13</div>
        <div id="b-btn" class="btn" style="color:#060">B<br>?</div>
        <div id="x-btn" class="btn" style="color:#060">X<br>zoom</div>
        <div id="y-btn" class="btn" style="color:#060">Y<br>zoom</div>
    </div>
    <div id="note">D-Pad and A respond to keydown/keyup. B/X/Y trigger browser actions.</div>
    <div id="log"></div>
<script>
(function() {
    var keys = {38:'up', 40:'dn', 37:'lf', 39:'rt', 13:'a'};
    var log = document.getElementById('log');
    function l(m) { log.innerHTML = m + '<br>' + log.innerHTML; }
    document.addEventListener('keydown', function(e) {
        var k = keys[e.keyCode];
        if (k) {
            e.preventDefault();
            document.getElementById(k).classList.add('active');
            l(Date.now() + ' keydn ' + e.keyCode);
        } else {
            l(Date.now() + ' keydn ' + e.keyCode + ' (unmapped)');
        }
    });
    document.addEventListener('keyup', function(e) {
        var k = keys[e.keyCode];
        if (k) {
            e.preventDefault();
            document.getElementById(k).classList.remove('active');
            l(Date.now() + ' keyup ' + e.keyCode);
        }
    });
    l('ready');
})();
</script>
</body>
</html>
