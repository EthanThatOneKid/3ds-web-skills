<!DOCTYPE html>
<html>
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">
    <title>3DS Input Debug</title>
    <style>
        body { margin: 0; background: #111; color: #0f0; font: 12px monospace; height: 100vh; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id=\"c\"></canvas>
<script>
// Real 3DS: use webkitGetGamepads (must poll, no events)
// Desktop fallback: keyboard events
var lastPressed = 'None';
var lastCode = '-';

function draw() {
    var c = document.getElementById('c');
    var ctx = c.getContext('2d');
    var W = c.width = Math.min(400, innerWidth);
    var H = c.height = Math.min(320, innerHeight);
    
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#0f0';
    ctx.font = '14px monospace';
    ctx.fillText('3DS Input Debug', 10, 20);
    ctx.fillText('Press buttons to see codes', 10, 38);
    
    ctx.fillStyle = '#333';
    ctx.fillRect(10, 50, W-20, 60);
    
    ctx.fillStyle = '#0f0';
    ctx.font = '20px monospace';
    ctx.fillText('Pressed: ' + lastPressed, 20, 80);
    ctx.fillText('Code: ' + lastCode, 20, 100);
    
    ctx.font = '10px monospace';
    ctx.fillStyle = '#666';
    ctx.fillText('3DS: poll via webkitGetGamepads()', 10, H-20);
    ctx.fillText('Desktop: click + keyboard', 10, H-8);
}

draw();

// Desktop fallback: click to \"press\" buttons
var buttons = ['Up','Down','Left','Right','A','B','X','Y','L','R','Start','Select'];
document.addEventListener('click', function(e) {
    var x = e.clientX / innerWidth * 2 - 1;
    var y = e.clientY / innerHeight * 2 - 1;
    if (x < 0 && y < 0) { lastPressed = 'A'; lastCode = '13 (Enter)'; }
    else if (x > 0 && y < 0) { lastPressed = 'B'; lastCode = '0x00000040'; }
    else if (x < 0 && y > 0) { lastPressed = 'Y'; lastCode = '0x00000020'; }
    else { lastPressed = 'X'; lastCode = '0x00000100'; }
    draw();
});

document.addEventListener('keydown', function(e) {
    var map = {38:'Up',40:'Down',37:'Left',39:'Right',13:'A',90:'B',88:'X',89:'Y',81:'L',87:'R'};
    var codeMap = {38:'0x00000001',40:'0x00000008',37:'0x00000002',39:'0x00000004',13:'0x00000080',90:'0x00000040',88:'0x00000100',89:'0x00000020',81:'0x00000040',87:'0x00000020'};
    lastPressed = map[e.keyCode] || '?';
    lastCode = codeMap[e.keyCode] || e.keyCode;
    draw();
});

// Poll gamepad for real 3DS (no events, must poll)
setInterval(function() {
    var gp = navigator.webkitGetGamepads ? navigator.webkitGetGamepads()[0] : null;
    if (!gp) return;
    var names = ['B','A','Y','X','L','R','ZL','ZR','Select','Start','-','-','Up','Down','Left','Right'];
    for (var i = 0; i < gp.buttons.length; i++) {
        if (gp.buttons[i].pressed) {
            lastPressed = names[i] || i;
            lastCode = 'buttons[' + i + ']';
            draw();
        }
    }
}, 1000/30);
</script>
</body>
</html>
