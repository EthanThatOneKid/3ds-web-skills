<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3DS Input Debug</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
        #title { padding: 10px; font-size: 20px; border-bottom: 1px solid #030; }
        #status { padding: 30px; font-size: 36px; text-align: center; }
        #log { padding: 10px; font-size: 14px; height: 150px; overflow: auto; border-top: 1px solid #030; }
        #toucharea { padding: 30px; text-align: center; color: #060; border-top: 1px solid #030; }
    </style>
</head>
<body>
    <div id="title">3DS INPUT DEBUG</div>
    <div id="status">PRESS BUTTON<br>or TOUCH</div>
    <div id="log"></div>
    <div id="toucharea">TOUCH AREA</div>

<script>
(function() {
    var status = document.getElementById('status');
    var log = document.getElementById('log');
    var toucharea = document.getElementById('toucharea');

    function update(msg) {
        status.innerHTML = msg;
        log.innerHTML = (new Date().toISOString().substr(11,12)) + ' ' + msg + '<br>' + log.innerHTML;
    }

    window.addEventListener('keydown', function(e) {
        update('KEY: ' + e.key + ' code=' + e.keyCode);
    });

    window.addEventListener('keyup', function(e) {
        update('UP: ' + e.key);
    });

    window.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var t = e.touches[0];
        update('TOUCH ' + Math.round(t.clientX) + ',' + Math.round(t.clientY));
        toucharea.textContent = 'TOUCHING ' + Math.round(t.clientX) + ',' + Math.round(t.clientY);
    });

    window.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length > 0) {
            toucharea.textContent = 'DRAG ' + Math.round(e.touches[0].clientX) + ',' + Math.round(e.touches[0].clientY);
        }
    });

    window.addEventListener('touchend', function(e) {
        toucharea.textContent = 'TOUCH AREA';
    });

    update('READY');
})();
</script>
</body>
</html>
