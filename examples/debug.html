<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Debug</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
    var c = document.getElementById('c');
    var x = c ? c.getContext('2d') : null;
    var W = 320, H = 240;
    var lines = [];
    var keys = {};
    var touches = [];
    var gamepadInfo = 'no gamepad';

    function resize() {
        if (!c) return;
        W = c.width = Math.floor(window.innerWidth);
        H = c.height = Math.floor(window.innerHeight);
    }
    resize();
    window.addEventListener('resize', resize);

    function addLine(msg) {
        lines.push(msg);
        if (lines.length > 12) lines.shift();
    }

    // Catch ALL keyboard events
    window.addEventListener('keydown', function(e) {
        keys[e.key] = true;
        addLine('DN key=' + e.key + ' code=' + e.keyCode);
        e.preventDefault();
    });

    window.addEventListener('keyup', function(e) {
        keys[e.key] = false;
        addLine('UP key=' + e.key);
    });

    window.addEventListener('touchstart', function(e) {
        e.preventDefault();
        for (var i = 0; i < e.touches.length; i++) {
            touches.push({ x: e.touches[i].clientX, y: e.touches[i].clientY, t: Date.now() });
        }
        addLine('TOUCH ' + e.touches[0].clientX + ',' + e.touches[0].clientY);
    });

    window.addEventListener('touchend', function(e) {
        addLine('TOUCH END');
    });

    // Check gamepads periodically
    function checkGamepads() {
        if (!navigator.webkitGetGamepads) return;
        var gps = navigator.webkitGetGamepads();
        for (var i = 0; i < gps.length; i++) {
            var gp = gps[i];
            if (gp) {
                gamepadInfo = 'GP' + i + ': ' + gp.id.substring(0, 20);
                for (var j = 0; j < gp.buttons.length; j++) {
                    if (gp.buttons[j].pressed) {
                        addLine('GPbtn[' + j + ']=1');
                    }
                }
            }
        }
    }

    function draw() {
        if (!x) return;
        x.fillStyle = '#111';
        x.fillRect(0, 0, W, H);

        // Header
        x.fillStyle = '#0f0';
        x.font = '14px monospace';
        x.textAlign = 'center';
        x.fillText('3DS INPUT DEBUG', W / 2, 20);

        // Event log
        x.font = '11px monospace';
        x.textAlign = 'left';
        for (var i = 0; i < lines.length; i++) {
            x.fillText(lines[i], 4, 40 + i * 13);
        }

        // Active keys
        x.fillStyle = '#fff';
        x.font = '12px monospace';
        x.textAlign = 'center';
        var active = Object.keys(keys).filter(function(k) { return keys[k]; });
        x.fillText('ACTIVE: ' + (active.length ? active.join(',') : 'none'), W / 2, H * 0.75);

        // Gamepad status
        x.fillStyle = '#888';
        x.font = '10px monospace';
        x.fillText(gamepadInfo, W / 2, H * 0.88);

        // Instructions
        x.fillStyle = '#555';
        x.fillText('press any button or touch screen', W / 2, H - 10);
    }

    // Main loop
    var last = Date.now();
    function loop() {
        checkGamepads();
        draw();
        // Dim old touches
        var now = Date.now();
        for (var i = touches.length - 1; i >= 0; i--) {
            if (now - touches[i].t > 2000) touches.splice(i, 1);
        }
        requestAnimationFrame(loop);
    }
    loop();

    // Initial
    addLine('ready');
    if (x) draw();
})();
</script>
</body>
</html>
