<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Debug</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #0f0;
            font: 12px monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="c" width="240" height="320"></canvas>
    <script>
        var ctx = document.getElementById("c").getContext("2d");
        var gp = navigator.webkitGetGamepads ? navigator.webkitGetGamepads() : [];
        var BUTTONS = [
            "A", "B", "X", "Y",
            "D-Pad Up", "D-Pad Down", "D-Pad Left", "D-Pad Right",
            "Start", "Select", "L", "R",
            "L Trig", "R Trig", "ZL", "ZR",
            "-", "+", "Home"
        ];
        var pad = gp[0];

        function update() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, 240, 320);
            ctx.fillStyle = "#0f0";
            ctx.fillText("3DS DEBUG", 70, 20);
            ctx.fillText("Gamepad: " + (pad ? "OK" : "NONE"), 10, 40);

            var y = 60;
            for (var i = 0; i < BUTTONS.length; i++) {
                var pressed = pad ? pad.buttons[i] && pad.buttons[i].pressed : false;
                ctx.fillStyle = pressed ? "#0f0" : "#333";
                ctx.fillText(BUTTONS[i] + ": " + (pressed ? "ON" : "off"), 10, y);
                y += 14;
            }

            if (pad) {
                ctx.fillText("CX:" + pad.axes[0], 130, 60);
                ctx.fillText("CY:" + pad.axes[1], 130, 74);
                ctx.fillText("AX:" + pad.axes[2], 130, 88);
                ctx.fillText("AY:" + pad.axes[3], 130, 102);
            }

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
