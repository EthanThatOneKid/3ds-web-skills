<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Debug</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var c = document.getElementById('c');
var x = c.getContext('2d');
var W, H;
var pressed = {};

function resize() {
    W = c.width = Math.floor(window.innerWidth);
    H = c.height = Math.floor(window.innerHeight);
}
resize();
window.addEventListener('resize', resize);

function btn(name, down) {
    if (down && !pressed[name]) console.log(name + ' DOWN');
    if (!down && pressed[name]) console.log(name + ' UP');
    pressed[name] = down;
}

function draw() {
    x.fillStyle = '#000';
    x.fillRect(0, 0, W, H);
    x.fillStyle = '#fff';
    x.font = Math.floor(W / 12) + 'px monospace';
    x.textAlign = 'center';

    var keys = Object.keys(pressed).filter(function(k) { return pressed[k]; });
    if (keys.length === 0) {
        x.fillText('Waiting...', W / 2, H / 2);
    } else {
        x.fillText(keys.join(' + '), W / 2, H / 2);
    }

    x.font = Math.floor(W / 20) + 'px monospace';
    x.fillText('3DS INPUT DEBUG', W / 2, H * 0.2);
}

setInterval(function() {
    var gamepads = navigator.webkitGetGamepads ? navigator.webkitGetGamepads() : [];
    for (var i = 0; i < gamepads.length; i++) {
        var gp = gamepads[i];
        if (!gp) continue;
        btn('A', gp.buttons[0] && gp.buttons[0].pressed);
        btn('B', gp.buttons[1] && gp.buttons[1].pressed);
        btn('X', gp.buttons[2] && gp.buttons[2].pressed);
        btn('Y', gp.buttons[3] && gp.buttons[3].pressed);
        btn('L', gp.buttons[4] && gp.buttons[4].pressed);
        btn('R', gp.buttons[5] && gp.buttons[5].pressed);
        btn('START', gp.buttons[8] && gp.buttons[8].pressed);
        btn('SELECT', gp.buttons[9] && gp.buttons[9].pressed);
        btn('UP', gp.buttons[12] && gp.buttons[12].pressed);
        btn('DOWN', gp.buttons[13] && gp.buttons[13].pressed);
        btn('LEFT', gp.buttons[14] && gp.buttons[14].pressed);
        btn('RIGHT', gp.buttons[15] && gp.buttons[15].pressed);
    }

    // Keyboard fallback (desktop)
    if (!navigator.webkitGetGamepads) {
        // No-op: keyboard events handled separately
    }

    draw();
}, 1000 / 30);

window.addEventListener('keydown', function(e) {
    var map = {
        'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
        'Z': 'B', 'X': 'A', 'A': 'Y', 'S': 'X',
        'z': 'B', 'x': 'A', 'a': 'Y', 's': 'X',
        'Shift': 'L', 'l': 'L', 'R': 'R',
        'Enter': 'START', '1': 'SELECT'
    };
    if (map[e.key]) { btn(map[e.key], true); e.preventDefault(); }
});

window.addEventListener('keyup', function(e) {
    var map = {
        'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
        'Z': 'B', 'X': 'A', 'A': 'Y', 'S': 'X',
        'z': 'B', 'x': 'A', 'a': 'Y', 's': 'X',
        'Shift': 'L', 'l': 'L', 'R': 'R',
        'Enter': 'START', '1': 'SELECT'
    };
    if (map[e.key]) { btn(map[e.key], false); e.preventDefault(); }
});

// Touch on canvas
window.addEventListener('touchstart', function(e) {
    var t = e.touches[0];
    var name = 'TOUCH';
    btn(name, true);
    setTimeout(function() { btn(name, false); }, 100);
});

draw();
</script>
</body>
</html>
