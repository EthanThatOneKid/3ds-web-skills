<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
  <title>Counter SPA</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:monospace;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .count{font-size:8em;font-weight:700;color:#e94560}
    .label{font-size:2em;margin-bottom:40px;color:#888}
    .btn{font-family:monospace;font-size:2.5em;padding:20px 60px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .btn:active{background:#c73659;transform:scale(0.97)}
    .btn:disabled{background:#555;color:#888;cursor:not-allowed}
    .debug{margin-top:40px;padding:20px;background:#0f0f1a;border-radius:8px;width:90%;max-width:500px;min-height:80px;font-size:1.2em;overflow:auto}
    .debug-line{margin:4px 0;color:#0f0}
  </style>
</head>
<body>
  <div class="label">COUNTER</div>
  <div class="count" id="c">-</div>
  <button class="btn" id="b" ontouchend="e(event)" onclick="i()">INCREMENT</button>
  <div class="debug" id="d"></div>
  <script>
    function log(m) {
      var d = document.getElementById("d");
      var s = document.createElement("div");
      s.className = "debug-line";
      s.appendChild(document.createTextNode(m));
      d.appendChild(s);
      d.scrollTop = d.scrollHeight;
    }
    function i() {
      var b = document.getElementById("b");
      var c = document.getElementById("c");
      b.disabled = true;
      c.innerHTML = "-";
      log("CLICK");
      var x = new XMLHttpRequest();
      x.open("POST", "/api/counter-spa/increment", true);
      x.onreadystatechange = function() {
        log("readyState=" + x.readyState);
        if (x.readyState === 4) {
          log("status=" + x.status);
          if (x.status === 200) {
            c.innerHTML = x.responseText;
            log("resp=" + x.responseText);
          }
          b.disabled = false;
        }
      };
      x.send(null);
    }
    function e(ev) {
      ev.preventDefault();
      i();
    }
    log("LOADED");
    (function() {
      var x = new XMLHttpRequest();
      x.open("GET", "/api/counter-spa/count", true);
      x.onreadystatechange = function() {
        if (x.readyState === 4 && x.status === 200) {
          document.getElementById("c").innerHTML = x.responseText;
          log("init=" + x.responseText);
        }
      };
      x.send(null);
    })();
  </script>
</body>
</html>
