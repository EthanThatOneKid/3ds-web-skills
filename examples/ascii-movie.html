<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS ASCII Movie</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            width: 100%; max-width: 320px; margin: 0 auto;
            height: 240px;
            overflow: hidden;
        }

        #screen {
            width: 100%;
            height: 100%;
            padding: 10px;
            font-size: 10px;
            line-height: 1.1;
            white-space: pre;
            overflow: hidden;
        }

        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 5px;
            background: rgba(0,0,0,0.8);
            font-size: 10px;
            color: #666;
        }

        .frame-num {
            color: #ff0;
        }
            canvas, img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="screen"></div>
    <div id="controls">
        <span><span style="color:#0af">A</span> Play/Pause</span>
        <span><span style="color:#0af">D-Pad</span> Seek</span>
        <span><span style="color:#0af">Touch</span> Toggle</span>
    </div>

    <script type="text/javascript">
    (function() {
        var screen = document.getElementById('screen');
        
        var frames = [
            // Frame 1: Night sky
            "              .           .        .\n" +
            "     *        .    *     .    .\n" +
            "        .    .       .         .\n" +
            "   .        *    .        *    .\n" +
            "        .         .    .      .\n" +
            "     *       .         .   *\n" +
            "   .      .    *    .       .\n" +
            "        .       .         .\n" +
            "              .                .\n" +
            "   *    .        *    .\n" +
            "___________________________________",

            // Frame 2: Moon rises
            "                 .\n" +
            "              .     .\n" +
            "            .   ___   .\n" +
            "           .   |   |   .\n" +
            "            .  |   |  .\n" +
            "    *        . |___|       *\n" +
            "        .       .   .        .\n" +
            "   .        .       .    .\n" +
            "        .    *    .       .\n" +
            "   *    .        .    *\n" +
            "___________________________________",

            // Frame 3: House silhouette
            "              .\n" +
            "              .\n" +
            "         /\\   .\n" +
            "        /  \\  .\n" +
            "       /____\\ .\n" +
            "      |  __  ||\n" +
            "      | |  | ||\n" +
            "      |_|__|_||\n" +
            "   *    ||  ||     *\n" +
            "        ||  ||\n" +
            "___________________________________",

            // Frame 4: House with windows lit
            "              .\n" +
            "              .\n" +
            "         /\\   .\n" +
            "        /  \\  .\n" +
            "       /____\\ .\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      |_|__|_||\n" +
            "   *    ||  ||     *\n" +
            "        ||  ||\n" +
            "___________________________________",

            // Frame 5: Car approaches
            "              .\n" +
            "              .\n" +
            "         /\\   .\n" +
            "        /  \\  .\n" +
            "       /____\\ .\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      |_|__|_||\n" +
            "      __    __   *\n" +
            "    (____)(____)\n" +
            "___________________________________",

            // Frame 6: Car at house
            "              .\n" +
            "              .\n" +
            "         /\\   .\n" +
            "        /  \\  .\n" +
            "       /____\\ .\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      |_|__|_||\n" +
            "      _||  ||_   O\n" +
            "    (____)(____)\n" +
            "___________________________________",

            // Frame 7: Character emerges
            "              .\n" +
            "              .\n" +
            "         /\\   .\n" +
            "        /  \\  .\n" +
            "       /____\\ .\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      |_|__|_||\n" +
            "      _||  ||_   O\n" +
            "       /||\\     .\n" +
            "___________________________________",

            // Frame 8: Handshake
            "              .\n" +
            "              .\n" +
            "         /\\   .\n" +
            "        /  \\  .\n" +
            "       /____\\ .\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      |_|__|_||\n" +
            "      _||  ||_   O\n" +
            "       /||\\   <>\n" +
            "___________________________________",

            // Frame 9: Sun rises
            "       .--.\n" +
            "    .--'   '--.\n" +
            "   /   \\     /   \\\n" +
            "  |     |   |     |\n" +
            "   \\   /     \\   /\n" +
            "    '--.   .--'\n" +
            "        '--'\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      _||  ||_\n" +
            "___________________________________",

            // Frame 10: Full sunrise
            "    _   .--.   _\n" +
            "   (_) '----' (_)\n" +
            "     /  ^^  \\\n" +
            "    |  OOOO  |\n" +
            "     \\______/\n" +
            "      |    |\n" +
            "      |[__][__||\n" +
            "      |[  ][  ||\n" +
            "      _||  ||_\n" +
            "    (____)(____)\n" +
            "___________________________________"
        ];

        var currentFrame = 0;
        var playing = false;
        var autoPlayInterval = null;
        var frameDelay = 1500;

        function render() {
            screen.innerHTML = frames[currentFrame];
        }

        function nextFrame() {
            currentFrame = (currentFrame + 1) % frames.length;
            render();
        }

        function prevFrame() {
            currentFrame = (currentFrame - 1 + frames.length) % frames.length;
            render();
        }

        function togglePlay() {
            playing = !playing;
            if (playing) {
                autoPlayInterval = setInterval(nextFrame, frameDelay);
            } else {
                clearInterval(autoPlayInterval);
            }
        }

        // Keyboard controls
        document.onkeydown = function(e) {
            var key = e.keyCode;
            if (key === 13) { // A
                e.preventDefault();
                togglePlay();
            } else if (key === 37) { // Left
                e.preventDefault();
                prevFrame();
            } else if (key === 39) { // Right
                e.preventDefault();
                nextFrame();
            } else if (key === 38) { // Up - speed up
                e.preventDefault();
                if (frameDelay > 500) frameDelay -= 250;
            } else if (key === 40) { // Down - slow down
                e.preventDefault();
                if (frameDelay < 3000) frameDelay += 250;
            }
        };

        // Touch controls
        document.body.ontouchstart = function(e) {
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault();
            togglePlay();
        };

        // Desktop click
        document.body.onclick = function() {
            togglePlay();
        };

        // Initialize
        render();
    })();
    </script>
</body>
</html>
