<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DS Button Demo</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const BUTTONS = [
      { code: 0x00000001, name: 'D-Pad Up' },
      { code: 0x00000002, name: 'D-Pad Down' },
      { code: 0x00000004, name: 'D-Pad Left' },
      { code: 0x00000008, name: 'D-Pad Right' },
      { code: 0x00000010, name: 'D-Pad Up' },
      { code: 0x00000020, name: 'D-Pad Down' },
      { code: 0x00000040, name: 'D-Pad Left' },
      { code: 0x00000080, name: 'D-Pad Right' },
      { code: 0x00000100, name: 'Start' },
      { code: 0x00000200, name: 'Select' },
      { code: 0x00000400, name: 'A' },
      { code: 0x00000800, name: 'B' },
      { code: 0x00001000, name: 'X' },
      { code: 0x00002000, name: 'Y' },
      { code: 0x00004000, name: 'L Trigger' },
      { code: 0x00008000, name: 'R Trigger' },
    ];

    let lastButton = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (lastButton) {
        ctx.fillStyle = '#00ff88';
        ctx.font = 'bold ' + Math.min(canvas.width / 6, 120) + 'px monospace';
        ctx.fillText(lastButton.name, canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = '#666';
        ctx.font = Math.min(canvas.width / 30, 24) + 'px monospace';
        ctx.fillText('0x' + lastButton.code.toString(16).toUpperCase(), canvas.width / 2, canvas.height / 2 + 80);
      } else {
        ctx.fillStyle = '#555';
        ctx.font = Math.min(canvas.width / 20, 48) + 'px monospace';
        ctx.fillText('Press a 3DS button', canvas.width / 2, canvas.height / 2);
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('keydown', function(e) {
      const code = e.charCodeAt(0) || e.keyCode;
      for (var i = 0; i < BUTTONS.length; i++) {
        if (BUTTONS[i].code === code) {
          lastButton = BUTTONS[i];
          draw();
          break;
        }
      }
    });

    // Touch support
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      lastButton = BUTTONS[Math.floor(Math.random() * BUTTONS.length)];
      draw();
    });

    resize();
  </script>
</body>
</html>
