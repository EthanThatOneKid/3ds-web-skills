<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Chiptune</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: 'Courier New', monospace;
            width: 100%; max-width: 320px; margin: 0 auto;
            height: 240px;
            overflow: hidden;
        }

        #visualizer {
            display: block;
            background: #000;
        }

        #track-list {
            position: absolute;
            top: 70px;
            left: 10px;
            font-size: 11px;
        }

        .track {
            padding: 4px 8px;
            margin: 2px 0;
            background: #222;
            border-radius: 3px;
            cursor: pointer;
        }

        .track.active {
            background: #0a0;
            color: #fff;
        }

        #info {
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 12px;
            color: #0f0;
        }

        #status {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 10px;
            color: #666;
        }

        #hint {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #555;
            padding: 3px;
            background: rgba(0,0,0,0.8);
        }

        #volume {
            position: absolute;
            top: 25px;
            right: 10px;
            font-size: 10px;
            color: #666;
        }
            canvas, img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <audio id="chiptune-player" controls loop autoplay style="width: 100%; margin-bottom: 10px;"></audio>
    <canvas id="visualizer" width="400" height="60"></canvas>
    <div id="info">CHIPTUNE PLAYER</div>
    <div id="status">NO AUDIO</div>
    <div id="volume">VOL: <span id="vol-level">50</span>%</div>
    <div id="track-list">
        <div class="track active" data-index="0">1. ARPEGGIO RUN</div>
        <div class="track" data-index="1">2. BASS LINE</div>
        <div class="track" data-index="2">3. MELODY</div>
    </div>
    <div id="hint">
        <span style="color:#0af">A</span> Play/Pause &bull;
        <span style="color:#0af">D-Pad Up/Down</span> Volume &bull;
        <span style="color:#0af">D-Pad Left/Right</span> Track
    </div>

    <script type="text/javascript">
    (function() {
        var visualizer = document.getElementById('visualizer');
        var vctx = visualizer.getContext('2d');
        var statusEl = document.getElementById('status');
        var volLevel = document.getElementById('vol-level');
        var trackEls = document.querySelectorAll('.track');

        var audioContext = null;
        var oscillator = null;
        var gainNode = null;
        var audioSupported = false;

        var currentTrack = 0;
        var isPlaying = false;
        var volume = 0.5;
        var animationId = null;

        var tracks = [
            {
                name: 'Arpeggio Run',
                notes: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 196.00],
                tempo: 150
            },
            {
                name: 'Bass Line',
                notes: [65.41, 82.41, 98.00, 65.41, 73.42, 87.31, 65.41, 73.42],
                tempo: 120
            },
            {
                name: 'Melody',
                notes: [440, 392, 349.23, 392, 440, 493.88, 523.25, 493.88, 440, 392, 349.23, 329.63],
                tempo: 180
            }
        ];

        var currentNoteIndex = 0;
        var noteInterval = null;
        var visualBars = [];
        for (var i = 0; i < 20; i++) {
            visualBars.push(Math.random() * 40);
        }

        var uriCache = {};
        var fallbackAudio = null;

        function generateTrackWavURI(track, numLoops, volume) {
            var sampleRate = 22050; // Lower sample rate to save RAM for base64 string on 3DS
            var noteDuration = 60 / track.tempo;
            var totalNotes = track.notes.length * numLoops;
            var numSamples = Math.floor(sampleRate * noteDuration * totalNotes);
            var bufferLength = 44 + numSamples * 2;
            var buffer = new ArrayBuffer(bufferLength);
            var view = new DataView(buffer);

            view.setUint32(0, 0x52494646, false);
            view.setUint32(4, 36 + numSamples * 2, true);
            view.setUint32(8, 0x57415645, false);
            view.setUint32(12, 0x666d7420, false);
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false);
            view.setUint32(40, numSamples * 2, true);

            var samplesPerNote = Math.floor(sampleRate * noteDuration);

            for (var loop = 0; loop < numLoops; loop++) {
                for (var n = 0; n < track.notes.length; n++) {
                    var freq = track.notes[n];
                    var offset = (loop * track.notes.length + n) * samplesPerNote;
                    
                    for (var i = 0; i < samplesPerNote; i++) {
                        var val = (Math.sin(2 * Math.PI * freq * (i / sampleRate)) >= 0) ? 1 : -1;
                        var t = i / sampleRate;
                        var decay = Math.exp(-t * 6.0);
                        var sample = Math.floor(val * 32767 * volume * decay);
                        
                        if (44 + (offset + i) * 2 < bufferLength) {
                            view.setInt16(44 + (offset + i) * 2, sample, true);
                        }
                    }
                }
            }

            var bytes = new Uint8Array(buffer);
            var binary = '';
            for (var i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return 'data:audio/wav;base64,' + btoa(binary);
        }

        function initAudio() {
            try {
                if (window.AudioContext || window.webkitAudioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioContext.createGain();
                    gainNode.connect(audioContext.destination);
                    gainNode.gain.value = volume;
                    audioSupported = true;
                    statusEl.innerHTML = 'READY';
                    statusEl.style.color = '#0f0';
                } else {
                    audioSupported = true;
                    statusEl.innerHTML = 'READY (WAV)';
                    statusEl.style.color = '#0f0';
                }
            } catch (e) {
                audioSupported = true;
                statusEl.innerHTML = 'READY (WAV)';
                statusEl.style.color = '#0f0';
            }
        }

        function playNote(freq) {
            if (!audioSupported) return;

            if (audioContext) {
                try {
                    if (oscillator) {
                        oscillator.stop();
                        oscillator.disconnect();
                    }

                    oscillator = audioContext.createOscillator();
                    oscillator.type = 'square';
                    oscillator.frequency.value = freq;
                    oscillator.connect(gainNode);
                    oscillator.start();

                    // Short envelope
                    setTimeout(function() {
                        if (oscillator) {
                            oscillator.stop();
                        }
                    }, 100);
                } catch (e) {}
            } else {
                // Fallback plays full tracks instead of individual notes due to async user-gesture restrictions
            }
        }

        function playTrack() {
            if (!audioSupported) return;

            var track = tracks[currentTrack];
            var interval = 60000 / track.tempo;

            currentNoteIndex = 0;

            if (audioContext) {
                playNote(track.notes[0]);
            } else {
                try {
                    if (!fallbackAudio) {
                        fallbackAudio = document.getElementById('chiptune-player');
                    }
                    fallbackAudio.volume = volume;
                    fallbackAudio.loop = true;
                    if (!uriCache[currentTrack]) {
                        uriCache[currentTrack] = generateTrackWavURI(track, 4, volume);
                    }
                    fallbackAudio.src = uriCache[currentTrack];
                    var playPromise = fallbackAudio.play();
                    if (playPromise !== undefined && playPromise.catch) {
                        playPromise.catch(function(err) {
                            statusEl.innerHTML = 'ERR: ' + err.message.substring(0, 15);
                            statusEl.style.color = '#f00';
                        });
                    }
                } catch (e) {
                    statusEl.innerHTML = 'ERR: ' + e.message.substring(0, 15);
                    statusEl.style.color = '#f00';
                }
            }

            if (noteInterval) clearInterval(noteInterval);
            noteInterval = setInterval(function() {
                if (!isPlaying) return;
                currentNoteIndex = (currentNoteIndex + 1) % track.notes.length;
                if (audioContext) {
                    playNote(track.notes[currentNoteIndex]);
                }
            }, interval);
        }

        function stopTrack() {
            if (noteInterval) clearInterval(noteInterval);
            if (oscillator) {
                try { oscillator.stop(); } catch (e) {}
            }
            if (!audioContext && fallbackAudio) {
                fallbackAudio.pause();
            }
        }

        function togglePlay() {
            if (!audioSupported) {
                initAudio();
            }

            isPlaying = !isPlaying;
            
            if (isPlaying) {
                playTrack();
                statusEl.innerHTML = 'PLAYING';
                statusEl.style.color = '#0f0';
                animate();
            } else {
                stopTrack();
                statusEl.innerHTML = 'PAUSED';
                statusEl.style.color = '#ff0';
            }
        }

        function setTrack(idx) {
            currentTrack = idx;
            for (var i = 0; i < trackEls.length; i++) {
                trackEls[i].classList.remove('active');
            }
            trackEls[idx].classList.add('active');

            if (isPlaying) {
                stopTrack();
                playTrack();
            }
        }

        function setVolume(delta) {
            volume = Math.max(0, Math.min(1, volume + delta));
            volLevel.innerHTML = Math.round(volume * 100);
            if (gainNode) {
                gainNode.gain.value = volume;
            }
            if (fallbackAudio) {
                fallbackAudio.volume = volume;
            }
        }

        function animate() {
            if (!isPlaying) {
                // Slow decay
                for (var i = 0; i < visualBars.length; i++) {
                    visualBars[i] = Math.max(5, visualBars[i] * 0.95);
                }
            } else {
                // Pulse to music
                var track = tracks[currentTrack];
                var beat = (currentNoteIndex % track.notes.length) / track.notes.length;
                
                for (var i = 0; i < visualBars.length; i++) {
                    var target = 10 + Math.sin(Date.now() / 100 + i * 0.5) * 20 + Math.random() * 10;
                    visualBars[i] = visualBars[i] * 0.7 + target * 0.3;
                }
            }

            // Draw visualizer
            vctx.fillStyle = '#000';
            vctx.fillRect(0, 0, 400, 60);

            var barWidth = 400 / visualBars.length;
            
            for (var i = 0; i < visualBars.length; i++) {
                var hue = (i / visualBars.length) * 60 + 120;
                vctx.fillStyle = 'hsl(' + hue + ', 100%, 50%)';
                vctx.fillRect(i * barWidth + 1, 60 - visualBars[i], barWidth - 2, visualBars[i]);
            }

            if (isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }

        // Keyboard controls
        document.onkeydown = function(e) {
            var key = e.keyCode;
            
            if (key === 13) { // A
                e.preventDefault();
                togglePlay();
            } else if (key === 38) { // Up
                e.preventDefault();
                setVolume(0.1);
            } else if (key === 40) { // Down
                e.preventDefault();
                setVolume(-0.1);
            } else if (key === 37) { // Left
                e.preventDefault();
                setTrack((currentTrack - 1 + tracks.length) % tracks.length);
            } else if (key === 39) { // Right
                e.preventDefault();
                setTrack((currentTrack + 1) % tracks.length);
            }
        };

        // Touch/click on track list
        for (var i = 0; i < trackEls.length; i++) {
            trackEls[i].ontouchstart = function(e) {
                e.preventDefault();
                var idx = parseInt(this.getAttribute('data-index'), 10);
                setTrack(idx);
                if (!isPlaying) togglePlay();
            };
            trackEls[i].onclick = function() {
                var idx = parseInt(this.getAttribute('data-index'), 10);
                setTrack(idx);
            };
        }

        // Initialize
        initAudio();
        animate();
    })();
    </script>
</body>
</html>
