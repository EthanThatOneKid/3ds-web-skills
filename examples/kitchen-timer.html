<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Kitchen Timer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #eee;
            font-family: "Courier New", Courier, monospace;
            width: 100%; max-width: 320px; margin: 0 auto;
            height: 240px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #timer-display {
            font-size: 64px;
            font-weight: bold;
            color: #d32f2f;
            background: #fff;
            padding: 10px 20px;
            border: 4px solid #333;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            background: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 0 #333;
        }
        button:active {
            box-shadow: 0 0 0 #333;
            transform: translate(2px, 2px);
        }
        #hint {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        .alarming {
            animation: flash 0.5s infinite alternate;
        }
        @keyframes flash {
            from { background-color: #fff; }
            to { background-color: #ffcccc; }
        }
    </style>
</head>
<body>
    <div id="timer-display">00:00</div>
    <div class="controls">
        <button id="min-btn">+ MIN</button>
        <button id="sec-btn">+ SEC</button>
        <button id="start-btn">START</button>
        <button id="reset-btn">RESET</button>
    </div>
    <div id="hint">Set time, then press START</div>

    <script>
        var display = document.getElementById('timer-display');
        var minBtn = document.getElementById('min-btn');
        var secBtn = document.getElementById('sec-btn');
        var startBtn = document.getElementById('start-btn');
        var resetBtn = document.getElementById('reset-btn');
        
        var totalSeconds = 0;
        var timerInterval = null;
        var isRunning = false;
        
        function updateDisplay() {
            var m = Math.floor(totalSeconds / 60);
            var s = totalSeconds % 60;
            display.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }
        
        function beep() {
            try {
                var actx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = actx.createOscillator();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, actx.currentTime);
                osc.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.1);
            } catch(e) {}
        }

        minBtn.onclick = function() {
            if (isRunning) return;
            totalSeconds = (totalSeconds + 60) % 6000; // max 99:59
            updateDisplay();
        };

        secBtn.onclick = function() {
            if (isRunning) return;
            var m = Math.floor(totalSeconds / 60);
            var s = (totalSeconds % 60 + 10) % 60;
            totalSeconds = m * 60 + s;
            updateDisplay();
        };

        startBtn.onclick = function() {
            if (totalSeconds === 0 && !isRunning) return;
            
            if (isRunning) {
                // Pause
                clearInterval(timerInterval);
                isRunning = false;
                startBtn.textContent = 'START';
                display.classList.remove('alarming');
            } else {
                // Start
                isRunning = true;
                startBtn.textContent = 'STOP';
                display.classList.remove('alarming');
                
                timerInterval = setInterval(function() {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        startBtn.textContent = 'START';
                        display.classList.add('alarming');
                        beep();
                        setTimeout(beep, 300);
                        setTimeout(beep, 600);
                    }
                }, 1000);
            }
        };

        resetBtn.onclick = function() {
            clearInterval(timerInterval);
            isRunning = false;
            totalSeconds = 0;
            startBtn.textContent = 'START';
            display.classList.remove('alarming');
            updateDisplay();
        };
    </script>
</body>
</html>
