<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure Time: Land of Ooo</title>
    <style>
        /* CSS 2.1 Compatible / 3DS WebKit */
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0;
            background: #5ccffa; /* Sky Blue */
            color: #333; 
            font-family: sans-serif;
            width: 100%; max-width: 320px; margin: 0 auto; /* Top screen focus */
            height: 240px;
            overflow: hidden;
        }

        #top-screen {
            height: 240px;
            width: 100%; max-width: 320px; margin: 0 auto;
            padding: 15px;
            background: #5ccffa;
            overflow-y: auto;
            border-bottom: 2px solid #3fa9f5;
        }

        #bottom-screen {
            display: none; /* In a real 3DS, this could be on the second screen */
            /* For the simulator, we will toggle visibility or stack them */
            position: absolute;
            top: 240px;
            height: 240px;
            width: 320px;
            background: #fff;
            padding: 10px;
            border: 4px solid #f9ed32; /* Yellow */
        }

        /* Combined View for Desktop/Simulator */
        #content-wrapper { height: 480px; width: 100%; max-width: 320px; margin: 0 auto; overflow: hidden; position: relative; }
        #top-screen { position: relative; height: 50%; }
        #bottom-screen { display: block; position: relative; height: 50%; width: 100%; border:0; border-top: 4px solid #f9ed32; }

        .location-title { font-size: 20px; font-weight: bold; color: #0056b3; margin-bottom: 8px; }
        .description { font-size: 14px; line-height: 1.4; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px; }
        
        .controls { margin-top: 10px; }
        .btn { 
            display: inline-block; 
            background: #f15a24; /* Orange */
            color: #fff; 
            padding: 10px 15px; 
            margin: 5px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-size: 13px;
            border: 2px solid #c1272d;
            cursor: pointer;
        }
        .btn.active { background: #c1272d; border-color: #fff; }
        .btn.utility { background: #333; border-color: #000; }

        #inventory { font-size: 11px; margin-top: 10px; color: #666; font-style: italic; }
        #dialogue { border-left: 4px solid #f15a24; padding-left: 10px; margin-top: 10px; font-weight: bold; }
            canvas, img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="content-wrapper">
        <div id="top-screen">
            <div id="location-ui">
                <div class="location-title" id="title">Tree Fort</div>
                <div class="description" id="desc">You are at the Tree Fort. Jake is sleeping on the couch.</div>
                <div id="dialogue"></div>
            </div>
            <div id="inventory">Inventory: Empty</div>
        </div>

        <div id="bottom-screen">
            <div style="font-weight:bold; margin-bottom: 5px;">ACTIONS</div>
            <div id="action-buttons" class="controls">
                <!-- Buttons generated by JS -->
            </div>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
            <div style="font-weight:bold; margin-bottom: 5px;">SYSTEM</div>
            <div class="controls">
                <div class="btn utility" onclick="game.save()">SAVE</div>
                <div class="btn utility" onclick="game.reset()">RESET</div>
            </div>
        </div>
    </div>

<script type="text/javascript">
(function() {
    var titleEl = document.getElementById('title');
    var descEl = document.getElementById('desc');
    var diagEl = document.getElementById('dialogue');
    var invEl = document.getElementById('inventory');
    var actionEl = document.getElementById('action-buttons');

    var world = {
        'fort': {
            name: 'The Tree Fort',
            desc: 'The cozy home of Finn and Jake. BMO is sitting in the corner.',
            npcs: { 'bmo': 'Beep boop! Adventure time, Finn!' },
            items: ['BMO Player'],
            paths: { 'candy': 'Travel to Candy Kingdom' }
        },
        'candy': {
            name: 'Candy Kingdom',
            desc: 'A kingdom made of delicious candy. Princess Bubblegum is busy in her lab.',
            npcs: { 'pb': 'Finn! I need you to check the Ice Kingdom. It is too cold today.' },
            items: ['Science Potion'],
            paths: { 'fort': 'Go back home', 'ice': 'Head to Ice Kingdom' }
        },
        'ice': {
            name: 'Ice Kingdom',
            desc: 'A freezing wasteland. Gunter the penguin is staring at you.',
            npcs: { 'gunter': 'Wenk! Wenk!' },
            items: ['Frozen Pizza'],
            paths: { 'candy': 'Return to the warmth' }
        }
    };

    var gameState = {
        loc: 'fort',
        inv: [],
        met: {},
        cursor: 0
    };

    // Persistence Utility (ES3)
    function setCookie(n, v) {
        var d = new Date(); d.setTime(d.getTime() + (365*24*60*60*1000));
        document.cookie = n + "=" + encodeURIComponent(v) + "; expires=" + d.toGMTString() + "; path=/";
    }
    function getCookie(n) {
        var ne = n + "="; var ca = document.cookie.split(';');
        for (var i=0; i<ca.length; i++) {
            var c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1);
            if (c.indexOf(ne) == 0) return decodeURIComponent(c.substring(ne.length));
        }
        return null;
    }

    var game = {
        save: function() {
            setCookie('ooo_save', JSON.stringify({loc: gameState.loc, inv: gameState.inv, met: gameState.met}));
            diagEl.innerHTML = "Progress saved to Ooo cookies!";
        },
        load: function() {
            var saved = getCookie('ooo_save');
            if (saved) {
                var s = JSON.parse(saved);
                gameState.loc = s.loc;
                gameState.inv = s.inv;
                gameState.met = s.met;
            }
        },
        reset: function() {
            setCookie('ooo_save', '');
            location.reload();
        },
        move: function(dest) {
            gameState.loc = dest;
            diagEl.innerHTML = "";
            gameState.cursor = 0;
            this.render();
        },
        take: function(item) {
            for(var i=0; i<world[gameState.loc].items.length; i++) {
                if(world[gameState.loc].items[i] === item) {
                    world[gameState.loc].items.splice(i, 1);
                    gameState.inv.push(item);
                    diagEl.innerHTML = "You picked up " + item + "!";
                    this.render();
                    return;
                }
            }
        },
        talk: function(npc, text) {
            diagEl.innerHTML = npc.toUpperCase() + ": " + text;
            gameState.met[npc] = true;
        },
        render: function() {
            var l = world[gameState.loc];
            titleEl.innerHTML = l.name;
            descEl.innerHTML = l.desc;
            invEl.innerHTML = "Inventory: " + (gameState.inv.length > 0 ? gameState.inv.join(', ') : 'Empty');

            var actions = [];
            // NPCs
            for (var npc in l.npcs) {
                (function(n, t) {
                    actions.push({ label: 'Talk to ' + n.toUpperCase(), fn: function() { game.talk(n, t); } });
                })(npc, l.npcs[npc]);
            }
            // Items
            for (var i=0; i<l.items.length; i++) {
                (function(it) {
                    actions.push({ label: 'Take ' + it, fn: function() { game.take(it); } });
                })(l.items[i]);
            }
            // Paths
            for (var p in l.paths) {
                (function(dest, label) {
                    actions.push({ label: label, fn: function() { game.move(dest); } });
                })(p, l.paths[p]);
            }

            actionEl.innerHTML = "";
            for (var a=0; a<actions.length; a++) {
                var b = document.createElement('div');
                b.className = 'btn' + (a === gameState.cursor ? ' active' : '');
                b.innerHTML = actions[a].label;
                (function(idx) {
                    b.onclick = function() { actions[idx].fn(); };
                })(a);
                actionEl.appendChild(b);
            }
            this.currentActions = actions;
        }
    };

    // D-Pad Control
    document.onkeydown = function(e) {
        var k = e.keyCode;
        if (k === 37 || k === 38) { // Left/Up
            gameState.cursor = (gameState.cursor > 0) ? gameState.cursor - 1 : game.currentActions.length - 1;
        } else if (k === 39 || k === 40) { // Right/Down
            gameState.cursor = (gameState.cursor < game.currentActions.length - 1) ? gameState.cursor + 1 : 0;
        } else if (k === 13) { // A
            if (game.currentActions[gameState.cursor]) {
                game.currentActions[gameState.cursor].fn();
            }
        }
        game.render();
    };

    window.game = game; // Expose for buttons
    game.load();
    game.render();
})();
</script>
</body>
</html>
