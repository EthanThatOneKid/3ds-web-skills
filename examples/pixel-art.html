<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Pixel Art</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            width: 100%; max-width: 320px; margin: 0 auto;
            height: 240px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }
        #toolbar {
            background: #333;
            padding: 5px;
            display: flex;
            gap: 5px;
        }
        .color-btn {
            width: 20px; height: 20px;
            border: 2px solid #555;
            cursor: pointer;
        }
        .color-btn.active { border-color: #fff; }
        #btn-clear {
            margin-left: auto;
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 0 10px;
            font-size: 10px;
            border-radius: 3px;
        }
        #grid-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        #canvas {
            display: grid;
            grid-template-columns: repeat(16, 12px);
            grid-template-rows: repeat(16, 12px);
            gap: 1px;
            background: #444;
            border: 2px solid #555;
            touch-action: none;
        }
        .pixel {
            background: #fff;
            width: 12px; height: 12px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div class="color-btn active" style="background:#000" data-c="#000"></div>
        <div class="color-btn" style="background:#fff" data-c="#fff"></div>
        <div class="color-btn" style="background:#f44336" data-c="#f44336"></div>
        <div class="color-btn" style="background:#4caf50" data-c="#4caf50"></div>
        <div class="color-btn" style="background:#2196f3" data-c="#2196f3"></div>
        <button id="btn-clear">CLR</button>
    </div>
    <div id="grid-container">
        <div id="canvas"></div>
    </div>

    <script>
        var canvas = document.getElementById('canvas');
        var colorBtns = document.querySelectorAll('.color-btn');
        var btnClear = document.getElementById('btn-clear');
        
        var currentColor = '#000';
        var isDrawing = false;

        colorBtns.forEach(function(btn) {
            btn.onclick = function() {
                colorBtns.forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentColor = btn.getAttribute('data-c');
            };
        });

        // Create grid
        var pixels = [];
        for(var i=0; i<256; i++) {
            var p = document.createElement('div');
            p.className = 'pixel';
            p.dataset.index = i;
            canvas.appendChild(p);
            pixels.push(p);
        }

        function paint(el) {
            if (el && el.classList.contains('pixel')) {
                el.style.background = currentColor;
                save();
            }
        }

        canvas.addEventListener('mousedown', function(e) {
            isDrawing = true;
            paint(e.target);
        });
        document.addEventListener('mouseup', function() { isDrawing = false; });
        canvas.addEventListener('mouseover', function(e) {
            if (isDrawing) paint(e.target);
        });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            isDrawing = true;
            var touch = e.touches[0];
            var el = document.elementFromPoint(touch.clientX, touch.clientY);
            paint(el);
        });
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!isDrawing) return;
            var touch = e.touches[0];
            var el = document.elementFromPoint(touch.clientX, touch.clientY);
            paint(el);
        });
        canvas.addEventListener('touchend', function() { isDrawing = false; });

        btnClear.onclick = function() {
            pixels.forEach(function(p) { p.style.background = '#fff'; });
            save();
        };

        function save() {
            var data = pixels.map(function(p) { return p.style.background || '#fff'; });
            try { localStorage.setItem('3ds_pixel', JSON.stringify(data)); } catch(e){}
        }

        try {
            var saved = localStorage.getItem('3ds_pixel');
            if (saved) {
                var data = JSON.parse(saved);
                data.forEach(function(c, i) { if (pixels[i]) pixels[i].style.background = c; });
            }
        } catch(e){}
    </script>
</body>
</html>
