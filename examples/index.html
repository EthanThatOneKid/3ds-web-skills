<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Web Examples</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }

        #container {
            width: 320px;
            margin: 0 auto;
            border: 1px solid #333;
            min-height: 240px;
            background-color: #222;
        }

        h1 {
            font-size: 18px;
            background-color: #444;
            margin: 0;
            padding: 10px;
            border-bottom: 2px solid #555;
            color: #f7d417;
        }

        .menu-list {
            margin: 0;
            padding: 10px;
            list-style: none;
        }

        .menu-item {
            display: block;
            background-color: #333;
            border: 1px solid #444;
            margin-bottom: 8px;
            -webkit-border-radius: 4px;
            border-radius: 4px;
        }

        .menu-item a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
        }

        .menu-item a:active {
            background-color: #555;
            color: #f7d417;
        }

        #footer {
            font-size: 10px;
            color: #666;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>3DS EXAMPLES</h1>

        <div class="menu-list">
            <div class="menu-item">
                <a href="flappy-bird.html">FLAPPY BIRD</a>
            </div>
            <div class="menu-item">
                <a href="debug.html">INPUT DEBUGGER</a>
            </div>
            <div class="menu-item">
                <a href="todo.html">TODO LIST</a>
            </div>
            <div class="menu-item">
                <a href="concentration.html">CONCENTRATION</a>
            </div>
            <div class="menu-item">
                <a href="adventure.html">TEXT ADVENTURE</a>
            </div>
            <div class="menu-item">
                <a href="pizza.html">PIZZA DELIVERY DEMAKE</a>
            </div>
        </div>

        <div id="footer">
            USE TOUCH OR A TO SELECT
        </div>
    </div>
</body>
</html>
