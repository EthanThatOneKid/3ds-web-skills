<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DS Concentration</title>
    <style>
        /* CSS 2.1 Compatible / Legacy WebKit Styles */
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #1a1a1a; 
            color: #fff; 
            font-family: sans-serif;
            width: 100%; max-width: 320px; margin: 0 auto; /* Top screen target */
            height: 240px;
            overflow: hidden;
        }

        #game-board {
            padding: 10px;
            width: 320px; /* Fits centered on top screen or naturally on bottom */
            margin: 0 auto;
        }

        .card {
            float: left;
            width: 70px;
            height: 50px;
            margin: 4px;
            background: #333;
            border: 2px solid #555;
            border-radius: 4px;
            text-align: center;
            font-size: 24px;
            line-height: 46px; /* Vertical center */
            cursor: pointer;
            position: relative;
        }

        .card.active {
            border-color: #00a2ff;
            background: #444;
        }

        .card .front { display: none; }
        .card.flipped .front { display: block; }
        .card.flipped .back { display: none; }
        
        .card.matched {
            background: #222;
            border-color: #0a0;
            color: #0f0;
            visibility: visible; /* Keep showing matched pairs */
        }

        #status {
            position: absolute;
            top: 200px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }

        .accent { color: #00a2ff; font-weight: bold; }

        .clearfix:after {
            content: "";
            display: table;
            clear: both;
        }
            canvas, img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="game-board" class="clearfix">
        <!-- 16 cards generated by JS -->
    </div>
    <div id="status">
        <span id="msg">FIND ALL MATCHES</span><br>
        <span class="accent">D-Pad</span> Move &bull; <span class="accent">A</span> Flip
    </div>

<script type="text/javascript">
(function() {
    var board = document.getElementById('game-board');
    var msg = document.getElementById('msg');
    
    var symbols = ['★', '♣', '♠', '♦', '♥', '☀', '☽', '♬', '★', '♣', '♠', '♦', '♥', '☀', '☽', '♬'];
    var cards = [];
    var cursorIdx = 0;
    var flippedCards = [];
    var matchedCount = 0;
    var isChecking = false;

    // Shuffle (Fisher-Yates)
    function shuffle() {
        for (var i = symbols.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = symbols[i];
            symbols[i] = symbols[j];
            symbols[j] = temp;
        }
    }

    function init() {
        shuffle();
        board.innerHTML = '';
        cards = [];
        for (var i = 0; i < 16; i++) {
            var card = document.createElement('div');
            card.className = 'card';
            card.id = 'card-' + i;
            card.innerHTML = '<div class="back">?</div><div class="front">' + symbols[i] + '</div>';
            board.appendChild(card);
            cards.push({
                el: card,
                symbol: symbols[i],
                flipped: false,
                matched: false
            });
        }
        updateCursor();
    }

    function updateCursor() {
        for (var i = 0; i < cards.length; i++) {
            cards[i].el.className = 'card' + 
                (cards[i].flipped ? ' flipped' : '') + 
                (cards[i].matched ? ' matched' : '') + 
                (i === cursorIdx ? ' active' : '');
        }
    }

    function flipCard(idx) {
        if (isChecking || cards[idx].flipped || cards[idx].matched) return;

        cards[idx].flipped = true;
        flippedCards.push(idx);
        updateCursor();

        if (flippedCards.length === 2) {
            checkMatch();
        }
    }

    function checkMatch() {
        isChecking = true;
        var idx1 = flippedCards[0];
        var idx2 = flippedCards[1];

        if (cards[idx1].symbol === cards[idx2].symbol) {
            // Match found
            cards[idx1].matched = true;
            cards[idx2].matched = true;
            matchedCount += 2;
            flippedCards = [];
            isChecking = false;
            updateCursor();
            
            if (matchedCount === 16) {
                msg.innerHTML = '<span style="color:#0f0">YOU MATCHED THEM ALL!</span>';
            }
        } else {
            // No match
            msg.innerHTML = 'TRY AGAIN';
            setTimeout(function() {
                cards[idx1].flipped = false;
                cards[idx2].flipped = false;
                flippedCards = [];
                isChecking = false;
                msg.innerHTML = 'FIND ALL MATCHES';
                updateCursor();
            }, 1000);
        }
    }

    // Input
    document.onkeydown = function(e) {
        var key = e.keyCode;
        var x = cursorIdx % 4;
        var y = Math.floor(cursorIdx / 4);

        if (key === 37) { // Left
            x = (x > 0) ? x - 1 : 3;
        } else if (key === 39) { // Right
            x = (x < 3) ? x + 1 : 0;
        } else if (key === 38) { // Up
            y = (y > 0) ? y - 1 : 3;
        } else if (key === 40) { // Down
            y = (y < 3) ? y + 1 : 0;
        } else if (key === 13) { // A / Enter
            flipCard(cursorIdx);
            return;
        } else {
            return;
        }
        
        e.preventDefault();
        cursorIdx = y * 4 + x;
        updateCursor();
    };

    // Touch support (for bottom screen)
    board.onclick = function(e) {
        var target = e.target;
        while (target && target.className.indexOf('card') === -1 && target !== board) {
            target = target.parentNode;
        }
        if (target && target.id && target.id.indexOf('card-') === 0) {
            var idx = parseInt(target.id.split('-')[1], 10);
            cursorIdx = idx;
            flipCard(idx);
        }
    };

    init();
})();
</script>
</body>
</html>
